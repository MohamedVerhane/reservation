upstream php-fpm {
    least_conn;
    server php-app-1:9000;
    server php-app-2:9000;
    server php-app-3:9000;
    server php-app-4:9000;
    keepalive 32;
}

upstream php-fpm-horizon {
    least_conn;
    server php-horizon-1:9000;
    server php-horizon-2:9000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # --- TLS (use your own certs or certbot) ---
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Limits ---
    client_max_body_size 64M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        image/svg+xml font/woff2;

    # --- Brotli (if compiled) ---
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- Static files ---
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Rate limiting: auth routes ---
    location ~ ^/(login|register|forgot-password|reset-password|email/verify) {
        limit_req zone=auth burst=10 nodelay;
        limit_conn addr 20;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- General rate limiting ---
    location / {
        limit_req zone=general burst=50 nodelay;
        limit_conn addr 100;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
        fastcgi_keep_alive on;

        # HTTP/2 push
        http2_push_preload on;
    }

    # --- Block dotfiles ---
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Deny blade/php in storage ---
    location ~ /storage/logs {
        deny all;
    }

    # --- Health check (no rate limit) ---
    location = /up {
        access_log off;
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    }
}
